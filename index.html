<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<title>Voter Search</title>
<meta name="description" content="Search the Bangalore Teachers' Constituency electoral roll by name or EPIC number.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #e2e6eb;
    --accent: #1f5fbf; --accent-soft: #e8f0fc; --mark: #fff1b8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e7eaee; --muted: #9aa4b1; --line: #2a313a;
            --accent: #7fb0ff; --accent-soft: #1d2a3d; --mark: #5c4a12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Kannada", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .search { display: flex; gap: 8px; max-width: 788px; margin: 0 auto; padding: 8px 0 2px; }
  .search input, .search select {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; }
  .search input { flex: 1 1 60%; min-width: 0; }
  .search select { flex: 0 1 38%; min-width: 0; max-width: 230px; }
  @media (max-width: 480px) { .search input, .search select { padding: 10px 10px; font-size: 16px; } }
  .search input:focus, .search select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { color: var(--muted); font-size: .92rem; margin: 6px 0 14px; min-height: 1.3em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 1.12rem; font-weight: 650; }
  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px;
           font-size: .85rem; font-weight: 600; white-space: nowrap; }
  .badge.warn { background: #fde8e8; color: #b42318; }
  @media (prefers-color-scheme: dark) { .badge.warn { background: #3d1d1d; color: #ff9b91; } }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: .95rem; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .maplink { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .maplink:hover { text-decoration-thickness: 2px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .epic { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 30px; }
  /* candidate strip + search box: one bar pinned to the top of the visible screen.
     Script moves it with the visual viewport so it stays in view when the phone keyboard is open. */
  .topbar { position: fixed; left: 0; right: 0; top: 0; z-index: 5; background: var(--bg);
            border-bottom: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.12);
            padding: calc(6px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
            will-change: transform; }
  .topbar img { display: block; width: 100%; max-width: 760px; height: auto; max-height: 18vh;
                object-fit: contain; border-radius: 6px; margin: 0 auto; }
  :root { --bh: 150px; }   /* height of the bar; set exactly by the script */
  main { padding-top: calc(var(--bh) + 20px); }
  html { scroll-padding-top: var(--bh); }
</style>
</head>
<body>
<header class="topbar">
  <img src="window.jpeg" width="1018" height="168" alt="Ballot: Sl No 4, Umesh Babu Pillegowda, symbol I">
  <div class="search">
    <input id="q" type="search" placeholder="Name or EPIC number" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <select id="place" aria-label="Constituency"><option value="">All constituencies</option></select>
  </div>
</header>
<main>
  <h1>Voter Search</h1>
  <p class="sub">Bangalore Teachers' Constituency electoral roll. Search by your name or EPIC number.</p>

  <div class="status" id="status">Loading…</div>
  <div id="results"></div>

  <footer>Data extracted from the published electoral roll PDFs. If your details look wrong, check the official roll.</footer>
</main>

<script src="data.js"></script>
<script>
(function () {
  // Keep the bar on screen. Phones (esp. iPhone Safari) scroll the page under "fixed" elements when the
  // keyboard opens; visualViewport tells us where the visible area really is, so we follow it.
  const bar = document.querySelector(".topbar");
  const vv = window.visualViewport;
  let frame = 0;
  function place() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      document.documentElement.style.setProperty("--bh", bar.offsetHeight + "px");
      const off = vv ? Math.max(0, vv.offsetTop) : 0;
      bar.style.transform = off ? `translateY(${off}px)` : "";
    });
  }
  bar.querySelector("img").addEventListener("load", place);
  window.addEventListener("resize", place);
  window.addEventListener("scroll", place, { passive: true });
  if (vv) { vv.addEventListener("resize", place); vv.addEventListener("scroll", place); }
  place();

  const MAX = 50;
  const qEl = document.getElementById("q"), placeEl = document.getElementById("place");
  const statusEl = document.getElementById("status"), out = document.getElementById("results");
  const norm = s => s.toUpperCase().replace(/[^A-Z0-9ಀ-೿]+/g, " ").trim();

  // [name, guardian, address, institution, epic, part, slNo, placeIndex, status D/M/'']
  const rows = window.VOTERS.map(r => {
    const n = norm(r[0]);
    return { r, tokens: n.split(" "), compact: n.replace(/ /g, ""), epic: r[4].toUpperCase().replace(/[^A-Z0-9]/g, "") };
  });
  window.PLACES.map((p, i) => [p, i]).sort((a, b) => a[0].localeCompare(b[0])).forEach(([p, i]) => {
    const o = document.createElement("option"); o.value = i; o.textContent = p; placeEl.appendChild(o);
  });
  statusEl.textContent = rows.length.toLocaleString() + " voters. Type at least 3 letters to search.";

  function score(row, qTokens, qCompact, qEpic) {
    if (qEpic && row.epic && row.epic.includes(qEpic)) return 5;
    // every typed word must start one of the words in the name, in any order (handles "N Ananda" vs "Ananda N")
    const used = new Set();
    let all = true;
    for (const t of qTokens) {
      const i = row.tokens.findIndex((w, k) => !used.has(k) && w.startsWith(t));
      if (i < 0) { all = false; break; }
      used.add(i);
    }
    if (all) return row.tokens.length === qTokens.length ? 4 : 3;
    if (qCompact.length >= 4 && row.compact.includes(qCompact)) return 2;   // "ajithkumar" vs "Ajith Kumar"
    return 0;
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function highlight(name, qTokens) {
    return name.split(/(\s+)/).map(w => {
      const W = norm(w), t = qTokens.find(t => t && W.startsWith(t));
      return t ? "<mark>" + esc(w.slice(0, t.length)) + "</mark>" + esc(w.slice(t.length)) : esc(w);
    }).join("");
  }

  function render() {
    const raw = qEl.value, q = norm(raw), place = placeEl.value;
    if (q.replace(/ /g, "").length < 3) {
      out.innerHTML = "";
      statusEl.textContent = rows.length.toLocaleString() + " voters. Type at least 3 letters to search.";
      return;
    }
    const qTokens = q.split(" "), qCompact = q.replace(/ /g, "");
    const qEpic = /\d/.test(qCompact) && qCompact.length >= 4 ? qCompact : "";
    const hits = [];
    for (const row of rows) {
      if (place !== "" && row.r[7] !== +place) continue;
      const s = score(row, qTokens, qCompact, qEpic);
      if (s) hits.push([s, row]);
    }
    hits.sort((a, b) => b[0] - a[0] || a[1].r[0].localeCompare(b[1].r[0]));
    window.scrollTo(0, 0);   // new search: show the first results right under the bar
    statusEl.textContent = hits.length === 0 ? "No match. Try fewer letters, or only your first name."
      : hits.length > MAX ? `${hits.length.toLocaleString()} matches. Showing the first ${MAX}; add your initial or pick a constituency to narrow it.`
      : `${hits.length} match${hits.length === 1 ? "" : "es"}.`;
    out.innerHTML = hits.slice(0, MAX).map(([, { r }]) => `
      <div class="card">
        <div class="top"><span class="name">${highlight(r[0], qTokens)}</span>
          <span>${r[8] === "D" ? '<span class="badge warn">Deleted in roll</span> ' : r[8] === "M" ? '<span class="badge">Modified (#)</span> ' : ""}<span class="badge">Part ${r[5]} · Sl No ${r[6]}</span></span></div>
        <dl>
          <dt>Constituency</dt><dd>${esc(window.PLACES[r[7]])}</dd>
          <dt>Location details</dt><dd>${booth(r[5])}</dd>
          <dt>Guardian</dt><dd>${esc(r[1]) || "—"}</dd>
          <dt>Address</dt><dd>${esc(r[2]) || "—"}</dd>
          <dt>Institution</dt><dd>${esc(r[3]) || "—"}</dd>
          <dt>EPIC No</dt><dd class="epic">${esc(r[4]) || "—"}</dd>
        </dl>
      </div>`).join("");
  }

  function booth(part) {
    const b = (window.BOOTHS || {})[part];
    if (!b) return "—";
    return `<a class="maplink" href="${esc(b[1])}" target="_blank" rel="noopener">${esc(b[0])} <span aria-hidden="true">↗</span></a>`;
  }

  let timer;
  qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 120); });
  placeEl.addEventListener("change", render);
})();
</script>
</body>
</html>
